name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Default mode: tables are Parquet folders and the Delta writes are replaced by their
  # plain-Spark equivalents (no Delta Lake needed).
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit tests
        run: pytest -m "not integration"

      - name: Integration tests (full pipeline over the simulated deliveries)
        run: pytest -m integration

  # Delta mode: tables are Delta tables and the real Delta writes run (replaceWhere, MERGE).
  # Also checks that each Delta MERGE gives exactly the same table as its plain-Spark equivalent.
  pytest-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HR_TESTS_DELTA: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit tests, including the Delta MERGE vs plain-Spark checks
        run: pytest -m "not integration"

      - name: Integration tests with Delta tables
        run: pytest -m integration
